# Runs the tests, then publishes the site in web/ to GitHub Pages.
# Once a day it first refreshes the real open data (DIVI ICU, World Bank) into web/data,
# commits it when it changed, and deploys in the same run: a commit pushed with GITHUB_TOKEN
# does not start another workflow, so the deploy cannot wait for a push event.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 11:30 UTC: after the 12:00 (CET) DIVI reporting deadline in winter, 13:30 local in summer
    - cron: "30 11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run data
        working-directory: web
      - name: Commit the new snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "Data unchanged"
          else
            git commit -m "data: DIVI and World Bank snapshot $(date -u +%F)"
            git push
          fi

  test:
    needs: data
    if: ${{ !cancelled() && (needs.data.result == 'success' || needs.data.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
        working-directory: web

  deploy:
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The branch head, so a scheduled run deploys the snapshot the data job just committed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      # Only the files the page loads; tests, tools and docs stay out of the site.
      - name: Collect the site
        run: |
          mkdir _site
          cp -r web/index.html web/src web/styles web/data _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
